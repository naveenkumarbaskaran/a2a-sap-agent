[project]
name = "a2a-sap-maintenance-sample"
version = "1.0.0"
description = "SAP Maintenance Order Agent — A2A sample with PEOS architecture"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "a2a-sdk[http-server]>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.3.0",
    "litellm>=1.30.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
sap-maintenance-agent = "sap_maintenance.__main__:main"
